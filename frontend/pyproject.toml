[project]
name = "datapulse-frontend"
version = "0.1.0"
description = "Streamlit interface for the DataPulse monitoring system"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1.0",
    "streamlit>=1.67,<2.0",
    "websockets>=15,<18",
    "altair>=5.5,<7",
    "pandas>=2.2,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
